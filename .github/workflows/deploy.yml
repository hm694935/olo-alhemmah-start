name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (static prerender)
        run: bun run build

      - name: Verify static output
        id: verify
        run: |
          # Detect the static output dir: nitro presets differ between environments
          # (cloudflare-module -> dist/client, static/node -> .output/public).
          for dir in dist/client .output/public dist .output; do
            if [ -f "$dir/index.html" ]; then OUT="$dir"; break; fi
          done
          if [ -z "$OUT" ]; then
            echo "No prerendered index.html found. Build output:"
            ls -R dist .output 2>/dev/null | head -50
            exit 1
          fi
          grep -qa "أكاديمية علو الهمة" "$OUT/index.html" || { echo "content missing in $OUT/index.html"; exit 1; }
          test -f "$OUT/CNAME" || { echo "CNAME missing in $OUT"; exit 1; }
          echo "Static output verified in: $OUT"
          echo "out_dir=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.verify.outputs.out_dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
